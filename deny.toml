# cargo-deny configuration (same shape as the portfolio's other Rust repositories).
# Read the job log: an advisory acknowledgement is the PM's call at gate, never a config edit.
[graph]
all-features = true

[advisories]
version = 2
# RUSTSEC-2026-0543 (chrono 0.4.45 unmaintained, "No safe upgrade is available"): a maintenance
# advisory, not a vulnerability; chrono is a direct dependency used for timestamps. EXPIRES 2026-12-17
# (30 days; PM portfolio ruling A, via pm-platform 2026-11-23): re-check then; do not extend without a
# new decision. Owner: fmp-rs lane. Exit: the ROADMAP row "Leave chrono" (move to jiff or time); remove
# this entry when chrono is out of Cargo.lock.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no safe upgrade; maintenance advisory, not a vulnerability; expires 2026-12-17; exit = ROADMAP row to leave chrono" },
]

[licenses]
version = 2
# Allow list, read from `cargo deny list`: a new dependency whose licence expression cannot be
# satisfied from these fails the job. Dual-licensed crates (jiff, r-efi, rustix, the objc2 family)
# are satisfied by their MIT or Apache-2.0 arm; Unicode-3.0 is the ICU data and unicode-ident.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    # The TLS/crypto stack under reqwest (ring, rustls-webpki, aws-lc-*): all permissive.
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
