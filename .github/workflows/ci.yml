name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build, test, clippy, fmt, doc
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --locked --all-targets

      - name: cargo test
        run: cargo test --locked --no-fail-fast

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps

  deny:
    name: cargo deny (advisories, licences, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to a full commit SHA (the tag v2.1.1, read from the action's repository on 2026-10-11).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources

  # Advisory (PM TASK 2026-10-24): NOT a required check and no rule is silenced here. The called workflow fixes the rule profile and the
  # CodeRipper version; this repository passes nothing (it is public, so the default GitHub-hosted runner is right).
  portfolio:
    permissions:
      contents: read
    uses: ciresnave/coderipper/.github/workflows/portfolio.yml@c665210ad0972cf3ddb7bc81bdd7800c3248a938 # coderipper commit c665210 (its portfolio.yml pins CodeRipper 0.8.19)
