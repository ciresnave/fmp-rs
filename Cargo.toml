[package]
    authors       = ["Eric Evans <ciresnave@gmail.com>"]
    categories    = ["api-bindings", "finance"]
    description   = "Production-grade Rust client for Financial Modeling Prep API with intelligent caching, rate limiting, and comprehensive endpoint coverage"
    documentation = "https://docs.rs/fmp-rs"
    edition       = "2021"
    homepage      = "https://github.com/ciresnave/fmp-rs"
    keywords      = ["api", "finance", "fmp", "market-data", "stocks"]
    license       = "MIT OR Apache-2.0"
    name          = "fmp-rs"
    readme        = "README.md"
    repository    = "https://github.com/ciresnave/fmp-rs"
    version       = "0.2.1"

    [package.metadata.docs.rs]
        all-features = true
        rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
    chrono             = { version = "0.4", features = ["serde"] }
    futures            = "0.3"
    rand               = "0.10"
    reqwest            = { version = "0.13", features = ["brotli", "gzip", "json", "query"] }
    serde              = { version = "1.0", features = ["derive"] }
    serde_json         = "1.0"
    thiserror          = "2.0"
    tokio              = { version = "1.0", features = ["full"] }
    tracing            = "0.1"
    tracing-subscriber = "0.3"
    url                = "2.5"

[dev-dependencies]
    criterion  = { version = "0.8", features = ["html_reports"] }
    mockito    = "1.4"
    tokio-test = "0.4"
    wiremock   = "0.6"

[[bench]]
    harness = false
    name    = "performance"
